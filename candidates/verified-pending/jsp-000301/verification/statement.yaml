id: "STMT-jsp-000301-v1"
status: active
supersedes: null
statement:
  text: "Jsp301.JSP_301 : there exist two consecutive powerful natural numbers that are not squares (witnessed by 12167 = 23^3 and 12168 = 2^3·3^2·13^2); i.e. it is not the case that every pair of consecutive powerful numbers are both squares."
  natural_language_source: "Consecutive powerful numbers need not be squares (catalog JSP-000301; Erdős problem). Formal disproof: 12167 = 23^3 and 12168 = 2^3·3^2·13^2 are powerful and consecutive, neither is a square."
  definitions_reviewed:
    - name: "Nat.Prime"
      from_library: true
      review: "Standard mathlib definition of primality."
    - name: "IsPowerful / IsSquare"
      from_library: true
      review: "Powerful means every prime divisor has exponent at least 2; defined locally in Jsp301.lean over mathlib divisibility/powers."
  library:
    name: "mathlib"
    commit: "5ed2965256430c3649e86755f9576b54eca72435"
    meets_minimum_safe_version: true
