  theorem_name: "Jsp301.JSP_301"
  result: equivalent
  basis: "The informal problem (catalog JSP-000301) asks whether consecutive powerful numbers must be squares. This is a formal disproof: it exhibits 12167 = 23^3 and 12168 = 2^3·3^2·13^2, both powerful (every prime divisor has exponent at least 2) and consecutive, yet neither is a square. Thus consecutive powerful numbers need not be squares — the precise negation of the posed claim, equivalent to the informal statement."
